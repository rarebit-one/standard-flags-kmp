kotlin.code.style=official
kotlin.mpp.stability.nowarn=true
# iOS targets can't build on Linux; skip them there instead of failing.
kotlin.native.ignoreDisabledTargets=true

org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.caching=true

# Coordinates shared across all subprojects.
GROUP=one.rarebit.flags
VERSION_NAME=0.1.0

# vanniktech/gradle-maven-publish-plugin reads these for POM generation.
POM_NAME=standard-flags-kmp
POM_DESCRIPTION=Kotlin Multiplatform client for standard_flags: OFREP provider, last-good cache, tri-state reads, upgrade status.
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/rarebit-one/standard-flags-kmp

POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://opensource.org/licenses/MIT
POM_LICENSE_DIST=repo

POM_SCM_URL=https://github.com/rarebit-one/standard-flags-kmp
POM_SCM_CONNECTION=scm:git:git://github.com/rarebit-one/standard-flags-kmp.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/rarebit-one/standard-flags-kmp.git

POM_DEVELOPER_ID=rarebit-one
POM_DEVELOPER_NAME=Rarebit One
POM_DEVELOPER_URL=https://github.com/rarebit-one

# Publish to the Central Portal endpoint (not legacy OSSRH).
SONATYPE_HOST=CENTRAL_PORTAL
# In-memory GPG signing; CI sets ORG_GRADLE_PROJECT_signingInMemoryKey from the
# SIGNING_KEY secret. Without a key, a local publishToMavenLocal of a release
# version needs -PRELEASE_SIGNING_ENABLED=false (SNAPSHOT versions skip signing).
RELEASE_SIGNING_ENABLED=true
